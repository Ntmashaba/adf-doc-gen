<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__ — Data Factory Documentation</title>
<style>
:root{
  --bg:#F2F4F4; --panel:#FFFFFF; --panel2:#F7FAF9;
  --ink:#1B2528; --ink2:#5C6E72; --ink3:#8A9BA0;
  --line:#DBE3E3; --line2:#EAF0EF;
  /* two-hue system: teal = source/read side, copper = sink/write side */
  --src:#0F766E;  --srcBg:#E2F1EF;
  --snk:#B45F2A;  --snkBg:#F8ECE2;
  --accent:#0F766E;
  --move:#B45F2A; --moveBg:#F8ECE2;
  --xform:#4353A8; --xformBg:#E9EBF8;
  --orch:#334155; --orchBg:#E8ECF1;
  --read:#0F766E; --readBg:#E2F1EF;
  --ctl:#5C6E72;  --ctlBg:#EEF1F1;
  --ext:#7C3AED;  --extBg:#F1EAFC;
  --mgmt:#8A5A00; --mgmtBg:#F7EFDD;
  --ok:#157A46;   --okBg:#E7F5EE;
  --warn:#B45309; --warnBg:#FBF0E1;
  --bad:#B42318;  --badBg:#FBEAE8;
  --info:#5C6E72; --infoBg:#EEF1F1;
  --mono:"Cascadia Code","Cascadia Mono",Consolas,"SFMono-Regular",Menlo,monospace;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
a{color:var(--accent)}
.layout{display:grid;grid-template-columns:222px 1fr;min-height:100vh}
/* ---------------- nav rail ---------------- */
nav{background:var(--panel);border-right:1px solid var(--line);padding:1.1rem .8rem;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-size:.68rem;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:.35rem}
.doc-title{font-weight:600;font-size:1.02rem;line-height:1.25;margin-bottom:1.1rem;word-break:break-word}
.nav-group{font-size:.64rem;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:1rem .5rem .3rem}
.nav-btn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;font:inherit;color:var(--ink2);padding:.42rem .55rem;border-radius:6px;cursor:pointer}
.nav-btn:hover{background:var(--panel2);color:var(--ink)}
.nav-btn.active{background:var(--ink);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--snk)}
.nav-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nav-btn .n{font-family:var(--mono);font-size:.68rem;color:inherit;opacity:.65}
.nav-btn.disabled{opacity:.38;cursor:not-allowed}
/* ---------------- content ---------------- */
main{padding:1.4rem 2rem 4rem;max-width:1280px}
/* conveyor banner (signature): sources ▸ factory ▸ sinks */
.conveyor{display:flex;align-items:stretch;gap:0;margin-bottom:1.5rem;font-family:var(--mono)}
.conveyor .cell{flex:1;border:1.5px solid var(--ink);padding:.6rem .9rem;background:var(--panel)}
.conveyor .cell:first-child{border-radius:8px 0 0 8px;border-right-width:0;box-shadow:inset 4px 0 0 var(--src)}
.conveyor .cell:last-child{border-radius:0 8px 8px 0;border-left-width:0;box-shadow:inset -4px 0 0 var(--snk)}
.conveyor .cell.mid{flex:1.3;background:var(--ink);color:#fff;border-color:var(--ink)}
.conveyor .cell.mid .tag{color:#B9C6C4}
.conveyor .joint{width:28px;display:flex;align-items:center;justify-content:center;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);background:var(--line2);font-weight:700;color:var(--ink2)}
.conveyor .tag{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.conveyor .val{font-size:.86rem;font-weight:600;font-family:var(--sans)}
.conveyor .sub{font-size:.7rem;color:var(--ink2)}
.conveyor .cell.mid .sub{color:#B9C6C4}
.conveyor .partial{color:var(--warn)}
/* generic */
h1{font-size:1.45rem;font-weight:650;letter-spacing:-.01em;margin-bottom:.2rem}
h2{font-size:1.05rem;font-weight:650;margin:1.6rem 0 .6rem}
h3{font-size:.92rem;font-weight:650;margin:1rem 0 .4rem}
.sub{color:var(--ink2)}
.eyebrow{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1rem 1.1rem;margin-bottom:.8rem}
.note{border-left:3px solid var(--warn)}
.grid{display:grid;gap:.8rem}
.grid.c4{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.stat .big{font-size:1.6rem;font-weight:650;font-variant-numeric:tabular-nums}
.stat .lbl{font-size:.74rem;color:var(--ink2)}
table.t{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:.82rem}
table.t th{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:.5rem .7rem;border-bottom:1px solid var(--line);background:var(--panel2)}
table.t td{padding:.44rem .7rem;border-bottom:1px solid var(--line2);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
.badge{display:inline-block;font-family:var(--mono);font-size:.62rem;letter-spacing:.05em;padding:.12rem .45rem;border-radius:4px;white-space:nowrap;text-transform:uppercase}
.b-movement{background:var(--moveBg);color:var(--move)} .b-transform{background:var(--xformBg);color:var(--xform)}
.b-orchestration{background:var(--orchBg);color:var(--orch)} .b-read{background:var(--readBg);color:var(--read)}
.b-control{background:var(--ctlBg);color:var(--ctl)} .b-external{background:var(--extBg);color:var(--ext)}
.b-management{background:var(--mgmtBg);color:var(--mgmt)} .b-other{background:var(--ctlBg);color:var(--ctl)}
.b-ok{background:var(--okBg);color:var(--ok)} .b-warn{background:var(--warnBg);color:var(--warn)}
.b-bad{background:var(--badBg);color:var(--bad)} .b-info{background:var(--infoBg);color:var(--info)}
.b-src{background:var(--srcBg);color:var(--src)} .b-snk{background:var(--snkBg);color:var(--snk)}
.b-muted{background:var(--ctlBg);color:var(--ink3)}
.ref{font-family:var(--mono);font-size:.78rem;background:var(--panel2);border:1px solid var(--line2);border-radius:4px;padding:.05rem .3rem}
.xl{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-align:left}
.xl:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.search{width:280px;max-width:100%;padding:.42rem .6rem;border:1px solid var(--line);border-radius:6px;font:inherit;background:var(--panel);margin:0 0 .7rem}
.search:focus{outline:2px solid var(--accent);outline-offset:-1px}
.filter-row{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin-bottom:.7rem}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:.22rem .7rem;font-size:.76rem;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.empty{border:1.5px dashed var(--line);border-radius:8px;padding:2rem;text-align:center;color:var(--ink2);background:var(--panel2)}
.empty b{color:var(--ink)}
pre.code{font-family:var(--mono);font-size:.76rem;line-height:1.55;background:#1C2528;color:#D8E2E0;border-radius:6px;padding:.7rem .85rem;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
details{border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:.55rem}
details>summary{cursor:pointer;padding:.6rem .9rem;font-weight:600;list-style:none;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸";color:var(--ink3);font-size:.8rem;transition:transform .12s}
details[open]>summary::before{transform:rotate(90deg)}
details>.body{padding:.2rem .9rem .9rem;border-top:1px solid var(--line2)}
.mut{color:var(--ink2);font-size:.8rem}
.pill-list{display:flex;flex-wrap:wrap;gap:.3rem}
.hl{background:var(--snkBg)!important}
/* activity rows (3rd disclosure level) */
.act{border:1px solid var(--line2);border-radius:6px;margin:.3rem 0;background:var(--panel)}
.act>summary{padding:.42rem .7rem;font-weight:500;font-size:.84rem}
.act>summary .step{font-family:var(--mono);font-size:.7rem;color:var(--ink3);min-width:1.6rem}
.act>.body{padding:.4rem .8rem .7rem;font-size:.82rem}
.act .kv{display:grid;grid-template-columns:130px 1fr;gap:.15rem .8rem;margin:.3rem 0}
.act .kv .k{color:var(--ink3);font-size:.74rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;padding-top:.1rem}
.scopehdr{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:.3rem .6rem;margin:.7rem 0 .3rem}
/* orchestration tree */
.tree{list-style:none;padding-left:0}
.tree ul{list-style:none;padding-left:1.35rem;border-left:1.5px solid var(--line);margin-left:.55rem}
.tree li{margin:.35rem 0;position:relative}
.tree ul li::before{content:"";position:absolute;left:-1.35rem;top:.75em;width:1rem;border-top:1.5px solid var(--line)}
.tnode{display:inline-flex;align-items:center;gap:.45rem;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.3rem .65rem}
.tnode .tk{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;padding:.08rem .35rem;border-radius:3px}
.tk-trigger{background:var(--orchBg);color:var(--orch)}
.tk-pipeline{background:var(--snkBg);color:var(--snk)}
.tk-dataflow{background:var(--xformBg);color:var(--xform)}
.tk-missing{background:var(--badBg);color:var(--bad)}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.76rem;color:var(--ink2);margin:.4rem 0 .8rem}
.legend span{display:flex;align-items:center;gap:.35rem}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block}
@media (max-width:860px){.layout{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;flex-wrap:wrap;gap:.2rem;border-right:0;border-bottom:1px solid var(--line)}.doc-title,.brand,.nav-group{width:100%}main{padding:1rem}.conveyor{flex-direction:column}.conveyor .joint{width:auto;height:22px;border:1.5px solid var(--ink);border-top:0;border-bottom:0}.conveyor .cell:first-child{border-radius:8px 8px 0 0;border-right-width:1.5px}.conveyor .cell:last-child{border-radius:0 0 8px 8px;border-left-width:1.5px}}
@media print{nav{display:none}.layout{grid-template-columns:1fr}}
/* Modern palette shared with pbi-doc-gen: slate neutrals, indigo accent.
   Every text/background pair below meets WCAG AA (4.5:1). */
:root{
  --bg:#F5F7FB; --panel:#FFFFFF; --panel2:#F1F4F9;
  --ink:#0F172A; --ink2:#334155; --ink3:#475569;
  --line:#CBD5E1; --line2:#E2E8F0;
  --accent:#4F46E5; --accentSoft:#EEF2FF;
  --src:#0F766E; --srcBg:#CCFBF1; --read:#0F766E; --readBg:#CCFBF1;
  --snk:#B45309; --snkBg:#FEF3C7; --move:#B45309; --moveBg:#FEF3C7;
  --xform:#4338CA; --xformBg:#E0E7FF;
  --orch:#1E293B; --orchBg:#E2E8F0;
  --ctl:#475569; --ctlBg:#E2E8F0;
  --ext:#6D28D9; --extBg:#EDE9FE;
  --mgmt:#92400E; --mgmtBg:#FEF3C7;
  --ok:#047857; --okBg:#D1FAE5;
  --warn:#B45309; --warnBg:#FEF3C7;
  --bad:#BE123C; --badBg:#FFE4E6;
  --info:#334155; --infoBg:#E2E8F0;
}
a,.xl{color:var(--accent)}
nav{background:#0F172A;border-right:0}
.brand,.nav-group{color:#94A3B8}
.doc-title{color:#fff}
.nav-btn{color:#CBD5E1}.nav-btn:hover{background:#1E293B;color:#fff}
.nav-btn.active{background:#1E293B;color:#fff;box-shadow:inset 3px 0 0 #818CF8}
.nav-btn .n{opacity:.85}
.nav-btn.disabled{opacity:.55}
.nav-btn:focus-visible{outline-color:#A5B4FC}
main{min-width:0}
.card,table.t,details{border-radius:12px}
.card{box-shadow:0 1px 2px #0f172a0d,0 4px 12px #0f172a0a}
table.t th{color:var(--ink2);background:#E9EEF5;letter-spacing:.04em;font-size:.7rem}
table.t td,.ref,.mut,.tnode,details>summary,.kv>div{overflow-wrap:anywhere}
table.t{table-layout:auto}
.badge{border-radius:999px;padding:.12rem .55rem}
.pill-list .badge,.badge.wrap{white-space:normal;overflow-wrap:anywhere;text-align:left}
.chip{border-radius:999px;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent)}
.hl{background:#E0E7FF!important}
.eyebrow,.stat .lbl,.legend,.scopehdr{color:var(--ink2)}
.act .kv .k{color:var(--ink2)}
.conveyor .cell.mid{background:#1E293B;border-color:#1E293B}
.conveyor .cell{border-color:#1E293B}
.conveyor .joint{background:var(--accentSoft);color:var(--accent);border-color:#1E293B}
.conveyor .tag{color:var(--ink2)} .conveyor .cell.mid .tag,.conveyor .cell.mid .sub{color:#CBD5E1}
.search:focus,.xl:focus-visible{outline-color:var(--accent)}
.table-wrap{overflow-x:auto;max-width:100%}
.where{color:var(--ink2);font-size:.78em;margin-left:.3em}
p,h1,h2,h3,li{overflow-wrap:anywhere}
.subtabs{display:flex;flex-wrap:wrap;gap:.2rem;border-bottom:1px solid var(--line);margin:-.2rem 0 1.1rem}
.subtab{border:0;background:none;font:inherit;color:var(--ink2);padding:.55rem .85rem;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.subtab:hover{color:var(--ink)}.subtab.active{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.subtab.disabled{opacity:.55;cursor:not-allowed}.subtab .n{font-size:.75rem;color:var(--ink2)}
.subtab:focus-visible,.chip:focus-visible,.primary-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:1rem;align-items:start}
.panel{position:sticky;top:1rem;max-height:calc(100vh - 2rem);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;box-shadow:0 1px 2px #0f172a0d,0 4px 12px #0f172a0a}
.panel h3{margin-top:1rem}
tr.sel td{background:var(--accentSoft)}
.kvl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:.3rem .8rem}
.kvl .k{color:var(--ink2);font-size:.8rem}
ul.plain{list-style:none;padding:0}ul.plain li{margin:.3rem 0}
.impact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem;margin-top:1rem}
.impact-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card.focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
.field{display:flex;flex-direction:column;gap:.25rem;font-size:.85rem;color:var(--ink2);margin:.4rem 0}
.field input,.field select,.field textarea{font:inherit;color:var(--ink);padding:.45rem .6rem;border:1px solid var(--line);border-radius:6px;background:var(--panel);max-width:100%}
.field select{max-width:640px}
.details-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.2rem 1rem}.details-grid .wide{grid-column:1/-1}
.savebar{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.7rem 1rem;margin:.8rem 0}
.savebar.dirty{border-color:var(--warn);background:var(--warnBg)}.savebar p{flex:1;margin:0}
.primary-btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:.5rem 1rem;font:inherit;font-weight:600;cursor:pointer}
.primary-btn:disabled{opacity:.5;cursor:not-allowed}
.issue-head{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
@media (max-width:1000px){.split{grid-template-columns:1fr}.panel{position:static;max-height:none}.impact-grid,.impact-grid.two,.details-grid{grid-template-columns:1fr}}
.grid>*,.layout>*{min-width:0}
main{overflow-wrap:anywhere}
.act.kv{display:grid;grid-template-columns:130px 1fr;gap:.15rem .8rem}
.act.kv .k{color:var(--ink2);font-size:.74rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;padding-top:.1rem}
@media (max-width:860px){.act.kv{grid-template-columns:1fr}}
@media (max-width:860px){
  table.t{display:block;overflow-x:auto;max-width:100%}
  .act .kv{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr!important}
  .badge{white-space:normal;overflow-wrap:anywhere}
  pre.code{max-width:100%}
}
</style>

<body>
<div class="layout">
  <nav id="nav" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<!--__DETAILS__-->
<script>
const DATA = /*__DATA__*/null;
/* ============================================================ helpers */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => (n ?? 0).toLocaleString();
const F = DATA.factory, MODE = DATA.mode;
const EIDX = {}; DATA.entities.forEach(e => EIDX[e.key] = e);
const PIDX = {}; DATA.pipelines.forEach(p => PIDX[p.name] = p);
const DFIDX = {}; DATA.dataflows.forEach(d => DFIDX[d.name] = d);
const DSIDX = {}; DATA.datasets.forEach(d => DSIDX[d.name] = d);
const LSIDX = {}; DATA.linkedServices.forEach(l => LSIDX[l.name] = l);
const TRIDX = {}; DATA.triggers.forEach(t => TRIDX[t.name] = t);
/* Element ids come from a lookup, so any name (quotes, backslashes, Unicode)
   maps to a safe, unique id. Links carry the name in a data attribute and one
   listener handles every click; names are never interpolated into script. */
const _ids = new Map();
const slug = s => { s = String(s); if(!_ids.has(s)) _ids.set(s, "i"+_ids.size); return _ids.get(s); };
const go = (kind, arg, label) => `<button class="xl" data-go="${kind}" data-arg="${esc(arg)}">${label}</button>`;
function flash(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.scrollIntoView({block:"center"});
  if(el.tagName==="DETAILS") el.open = true;
  el.style.boxShadow = "0 0 0 3px var(--snk)";
  setTimeout(()=>{ el.style.boxShadow=""; }, 1600);
}
const goTo = (tab, prefix, name) => { switchTab(tab); requestAnimationFrame(()=>flash(prefix+slug(name))); };
const goPipe = n => goTo("pipelines","pl-",n);
const goEnt  = k => { SEL_OBJ = k; switchTab("objects"); requestAnimationFrame(()=>{
  const row = document.getElementById("obj-"+slug(k)); if(row) row.scrollIntoView({block:"center"}); }); };
const goDf   = n => goTo("dataflows","df-",n);
const goDs   = n => goTo("datasets","ds-",n);
const goLs   = n => goTo("linked","ls-",n);
const goTrg  = n => goTo("triggers","trg-",n);
const GO = {pipe:goPipe, ent:goEnt, df:goDf, ds:goDs, ls:goLs, trg:goTrg,
            section: openSection, view: switchTab,
            obj: k => { SEL_OBJ = k; renderObjectPanel(); },
            impact: k => { IMPACT = k; switchTab("impact"); },
            csv: name => downloadCsv(name),
            issuefilter: p => { ISSUE_FILTER = p; switchTab("issues"); },
            objkind: k => { OBJ_KIND = k; switchTab("objects"); },
            wfilter: c => { wFilter = c; switchTab("warnings"); }};
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-go]");
  if(b && GO[b.dataset.go]) GO[b.dataset.go](b.dataset.arg);
});
const pipeLink = n => PIDX[n] ? go("pipe", n, esc(n))
                              : `<span class="ref" title="pipeline not supplied">${esc(n)}</span> <span class="badge b-bad">missing</span>`;
/* Same-named objects in different places (dbo.Sales on two servers) show where they live. */
const _labelCount = {}; DATA.entities.forEach(e => _labelCount[e.label.toLowerCase()] = (_labelCount[e.label.toLowerCase()]||0)+1);
const entWhere = e => { const ep = e.endpoint||{};
  return [ep.server||ep.url||(e.scope?`via ${e.scope}`:""), ep.database||ep.container].filter(Boolean).join(" / "); };
const entName = k => { const e = EIDX[k]; if(!e) return esc(k);
  const w = _labelCount[e.label.toLowerCase()]>1 ? entWhere(e) : "";
  return esc(e.label) + (w?`<span class="where">${esc(w)}</span>`:""); };
const entLink = k => EIDX[k] ? go("ent", k, entName(k)) : esc(k);
const entLabel = k => EIDX[k] ? EIDX[k].label : k;
const dfLink = n => DFIDX[n] ? go("df", n, esc(n))
                             : `<span class="ref" title="data flow not supplied">${esc(n)}</span> <span class="badge b-bad">missing</span>`;
const dsLink = n => DSIDX[n] ? go("ds", n, esc(n))
                             : `<span class="ref" title="dataset not supplied">${esc(n)}</span> <span class="badge b-bad">missing</span>`;

/* ============================================================ sections and views */

const SECTIONS = [

const LAST_VIEW = {};   // the view last open in each section

function buildNav(){
  const nav = document.getElementById("nav");
  let html = `<div class="brand">ADF Doc Gen</div><div class="doc-title">${esc(DATA.title)}</div>`;
  for(const sec of SECTIONS){
    const views = TABS.filter(t=>t.section===sec.id);
    const n = sec.id==="issues" ? (DATA.issues||[]).length : null;
    html += `<button class="nav-btn" id="sec-${sec.id}" data-go="section" data-arg="${sec.id}">${sec.label}${n?`<span class="n">${n}</span>`:""}</button>`;
  }
  nav.innerHTML = html;
}
function subtabs(sectionId, activeId){
  const views = TABS.filter(t=>t.section===sectionId);
  if(views.length<2) return "";
  return `<div class="subtabs" role="tablist">${views.map(t=>{
    const ok = t.avail(), c = ok && t.count ? t.count() : null;
    return ok ? `<button class="subtab${t.id===activeId?" active":""}" role="tab" aria-selected="${t.id===activeId}" id="nav-${t.id}" data-go="view" data-arg="${t.id}">${esc(t.label)}${c?` <span class="n">${c}</span>`:""}</button>`
              : `<button class="subtab disabled" title="${esc(t.why||"Not available for this input")}" aria-disabled="true" tabindex="-1">${esc(t.label)}</button>`;
  }).join("")}</div>`;
}
function openSection(id){
  const views = TABS.filter(t=>t.section===id && t.avail());
  const target = views.find(t=>t.id===LAST_VIEW[id]) || views[0];
  if(target) switchTab(target.id);
}
let CURRENT = null; const VIEW_STATE = {};
function switchTab(id){
  const tab = TABS.find(t=>t.id===id);
  if(!tab || !tab.avail()) return;
  LAST_VIEW[tab.section] = id;
  document.querySelectorAll(".nav-btn").forEach(b=>{
    const on = b.id==="sec-"+tab.section;
    b.classList.toggle("active", on);
    if(on) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  const main = document.getElementById("main");
  if(CURRENT) VIEW_STATE[CURRENT] = {
    q: [...main.querySelectorAll("input.search")].map(i=>i.value),
    open: [...main.querySelectorAll("details[open][id]")].map(d=>d.id)};
  main.innerHTML = subtabs(tab.section, id) + RENDER[id]();
  CURRENT = id;
  const st = VIEW_STATE[id];
  if(st){
    main.querySelectorAll("input.search").forEach((inp,i)=>{
      if(st.q[i]){ inp.value = st.q[i]; inp.dispatchEvent(new Event("input")); }});
    st.open.forEach(x=>{ const d=document.getElementById(x); if(d) d.open=true; });
  }
  window.scrollTo(0,0);
}

/* ============================================================ conveyor (signature banner) */
function conveyor(){
  const srcSystems = new Set(), snkSystems = new Set();
  for(const e of DATA.entities){
    const sys = e.endpoint.system || e.endpoint.server || e.endpoint.url || e.endpoint.container;
    const isRead = e.roles.some(r=>/source|read|lookup|metadata|existence/.test(r));
    const isWrite = e.roles.some(r=>/sink|written|deleted|target|executed/.test(r));
    if(sys && isRead) srcSystems.add(sys);
    if(sys && isWrite) snkSystems.add(sys);
  }
  const state = MODE==="factory"
    ? `<span class="sub">all references resolved</span>`
    : `<span class="sub partial">partial input — ${missing.length} unresolved reference(s)</span>`;
  return `<div class="conveyor" role="img" aria-label="Factory summary: ${MODE} mode">
    <div class="cell"><div class="tag">Sources</div><div class="val">${num(srcSystems.size)} system(s) read</div><div class="sub">design-time, statically derived</div></div>
    <div class="joint">▸</div>
    <div class="cell mid"><div class="tag">Factory</div><div class="val">${esc(DATA.title)}</div><div class="sub">${num(F.pipelineCount)} pipelines · ${num(F.activityCount)} activities · ${num(F.dataflowCount)} data flows</div>${state}</div>
    <div class="joint">▸</div>
    <div class="cell"><div class="tag">Sinks</div><div class="val">${num(snkSystems.size)} system(s) written</div><div class="sub">what this factory produces</div></div>
  </div>`;
}

  ${row("Resolved at runtime", n(c.dynamicActivities), c.dynamicActivities?"b-warn":"b-ok", "Targets built from parameters or expressions.")}
  ${c.unknownFootprints?row("Unknown footprint", c.unknownFootprints, "b-warn", "Activities whose data flow or code was not supplied or cannot be read."):""}

  ${DATA.redactions?row("Secrets withheld", DATA.redactions, "b-info", "Values that looked like secrets were replaced with [redacted]."):""}

  return `${conveyor()}

function journeys(){
  // Each way work starts: a trigger or an entry-point pipeline, and what the run reads and writes.
  const starts = [
    ...DATA.triggers.flatMap(t=>t.startsPipelines.map(pl=>({how:TRIDX[t.name]?go("trg",t.name,esc(t.name)):esc(t.name), note:t.detail, state:t.state, pl}))),
    ...DATA.pipelines.filter(p=>p.entryPoint).map(p=>({how:'<span class="mut">no trigger here</span>', note:"", state:"", pl:p.name}))];
  if(!starts.length) return "";
  const systems = keys => [...new Set(keys.map(k=>EIDX[k]).filter(e=>e&&PHYSICAL.has(e.kind)).map(e=>e.endpoint.system||e.endpoint.server||"unknown system"))];
  const rows = starts.map(s=>{ const p = PIDX[s.pl];
    if(!p) return `<tr><td>${s.how}</td><td>${pipeLink(s.pl)}</td><td colspan="2" class="mut">pipeline not supplied</td></tr>`;
    const r = p.effectiveReads.filter(k=>PHYSICAL.has(EIDX[k]?.kind)), w = p.effectiveWrites.filter(k=>PHYSICAL.has(EIDX[k]?.kind));
    return `<tr><td>${s.how}${s.state&&s.state.toLowerCase()!=="started"?` <span class="badge b-warn">${esc(s.state)}</span>`:""}<div class="mut">${esc(s.note||"")}</div></td>
      <td>${pipeLink(s.pl)}<div class="mut">${esc(p.roleLine)}</div></td>
      <td>${r.length} object(s)<div class="mut">${esc(systems(r).join(", ")||"—")}</div></td>
      <td>${w.length} object(s)<div class="mut">${esc(systems(w).join(", ")||"—")}</div>${p.effectiveIncomplete.length?' <span class="badge b-bad">incomplete</span>':""}</td></tr>`;}).join("");
  return `<h2>How work starts and what it touches</h2>
  <div class="table-wrap"><table class="t"><thead><tr><th>Started by</th><th>Pipeline</th><th>Reads (incl. called pipelines)</th><th>Writes</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function priorityIssues(){
  const top = (DATA.issues||[]).filter(i=>i.priority!=="low").slice(0,5);
  const n = (DATA.issues||[]).length;
  if(!n) return `<h2>Review issues</h2><div class="card"><b>No issues to review.</b> <span class="mut">See Review issues › All findings and notes for the limits of static analysis.</span></div>`;

  <p>${go("section","issues",`All ${n} review issue(s)`)}</p>`;

/* ============================================================ orchestration */
function rOrchestration(){
  const childEdges = DATA.orchestration.edges;
  const kids = {};
  for(const e of childEdges){
    const k = e.fromKind+":"+e.from;
    (kids[k] = kids[k] || []).push(e);
  }
  const seen = new Set();
  function nodeHtml(kind, name, detail){
    const link = kind==="trigger" ? (TRIDX[name]?go("trg", name, esc(name)):esc(name))
               : kind==="dataflow" ? dfLink(name) : pipeLink(name);
    const p = kind==="pipeline" ? PIDX[name] : null;
    const t = kind==="trigger" ? TRIDX[name] : null;
    return `<span class="tnode"><span class="tk tk-${kind}${(kind==='pipeline'&&!p)||(kind==='dataflow'&&!DFIDX[name])?' tk-missing':''}">${kind}</span>${link}
      ${t&&t.state?`<span class="badge ${t.state.toLowerCase()==="started"?"b-ok":"b-warn"}">${esc(t.state)}</span>`:""}
      ${p?`<span class="mut">${esc(p.roleLine)}</span>`:""}
      ${detail?`<span class="mut">· ${esc(detail)}</span>`:""}</span>`;
  }
  function branch(kind, name, detail, depth){
    const id = kind+":"+name;
    const repeat = seen.has(id);
    if(!repeat) seen.add(id);
    const children = repeat||depth>12 ? [] : (kids[id]||[]);
    const kidHtml = children.map(e=>branch(e.toKind, e.to, e.detail, depth+1)).join("");
    return `<li>${nodeHtml(kind,name,detail)}${repeat&&(kids[id]||[]).length?` <span class="mut">↺ expanded above</span>`:""}
      ${kidHtml?`<ul>${kidHtml}</ul>`:""}</li>`;
  }
  const triggerRoots = DATA.triggers.map(t=>branch("trigger", t.name, "", 0)).join("");
  const entryRoots = DATA.pipelines.filter(p=>p.entryPoint)
    .map(p=>branch("pipeline", p.name, "", 0)).join("");
  const orphanNote = DATA.pipelines.some(p=>p.entryPoint)
    ? `<p class="sub">Entry points are pipelines no trigger or pipeline in this factory starts. That is normal for orchestrators — but a worker pipeline here may be dead, or invoked externally (REST API, Synapse, Logic Apps); this document cannot tell which.</p>` : "";
  return `<h1>Orchestration — how work starts and cascades</h1>
  <p class="sub">The factory as a tree: triggers first, then pipelines nothing here invokes, drilling into ExecutePipeline calls and data flows. Click any name for its detail.</p>
  ${DATA.triggers.length?`<h2>From triggers</h2><ul class="tree">${triggerRoots}</ul>`:`<div class="empty"><b>No triggers supplied.</b><br>How these pipelines start is invisible to this document — they may be scheduled elsewhere or invoked externally.</div>`}
  ${entryRoots?`<h2>Entry points (no known invoker in this factory)</h2>${orphanNote}<ul class="tree">${entryRoots}</ul>`:""}`;
}

/* ============================================================ lineage */
let linFilter = "all";
function rLineage(){
  const movers = DATA.entities.filter(e=>e.upstream.length||e.downstream.length);
  const roots = movers.filter(e=>!e.upstream.length);
  const leaves = movers.filter(e=>!e.downstream.length);
  return `<h1>Data movement lineage</h1>
  <p class="sub">The file to consult for "where does X come from?", "what writes to warehouse Y?", and "if server Z dies, which pipelines break?". Edges marked <span class="badge b-info">opaque</span> hand off to code ADF cannot see — the chain is broken there, so absence of a downstream entry past that point is <b>not</b> evidence data does not flow. <span class="badge b-warn">dynamic</span> targets are built at runtime; the static name is indicative only.</p>
  <h2>Impact explorer</h2>
  <div class="card">
    <input class="search" id="lin-q" placeholder="Type a table, path, server, or dataset…" oninput="linExplore(this.value)">
    <div id="lin-result" class="mut">Pick an entity to see everything upstream (its dependencies) and downstream (its blast radius), transitively.</div>
  </div>
  <h2>Movement edges <span class="mut" style="font-weight:400">(${DATA.lineageEdges.length})</span></h2>
  <div class="filter-row">
    ${["all","opaque","dynamic"].map(f=>`<button class="chip ${linFilter===f?"on":""}" onclick="linFilter='${f}';switchTab('lineage')">${f}</button>`).join("")}
  </div>
  <table class="t"><thead><tr><th>Source(s)</th><th>Sink(s)</th><th>Via</th><th>Pipeline :: Activity</th><th>Notes</th></tr></thead><tbody>
  ${DATA.lineageEdges.filter(e=>linFilter==="all"||(linFilter==="opaque"&&e.opaque)||(linFilter==="dynamic"&&e.dynamic)).map(e=>`<tr>
    <td>${e.sources.map(entLink).join("<br>")||"—"}</td>
    <td>${e.sinks.map(entLink).join("<br>")||"—"}</td>
    <td class="mut">${esc(e.mechanism)}</td>
    <td>${pipeLink(e.pipeline)}<span class="mut"> :: ${esc(e.activity)}</span></td>
    <td class="mut">${e.opaque?'<span class="badge b-info">opaque</span> ':""}${e.dynamic?'<span class="badge b-warn">dynamic</span> ':""}${esc(e.detail)}</td></tr>`).join("")}
  </tbody></table>
  <h2>Roots and terminals</h2>
  <div class="grid" style="grid-template-columns:1fr 1fr">
    <div class="card"><div class="eyebrow" style="color:var(--src)">Roots — external inputs</div>
      <p class="mut">Nothing in this factory writes them; they come from outside.</p>
      <div class="pill-list">${roots.map(e=>`<span class="badge b-src" style="text-transform:none;font-size:.72rem">${entLink(e.key)}</span>`).join(" ")||"—"}</div></div>
    <div class="card"><div class="eyebrow" style="color:var(--snk)">Terminals — final outputs</div>
      <p class="mut">Nothing downstream in this factory consumes them.</p>
      <div class="pill-list">${leaves.map(e=>`<span class="badge b-snk" style="text-transform:none;font-size:.72rem">${entLink(e.key)}</span>`).join(" ")||"—"}</div></div>
  </div>
  <details id="closure"><summary>Full transitive closure (${movers.length} objects)</summary><div class="body table-wrap">
  <table class="t"><thead><tr><th>Entity</th><th>Kind</th><th>Depends on (all upstream)</th><th>Feeds (all downstream)</th></tr></thead><tbody>
  ${movers.slice().sort((a,b)=>a.label.localeCompare(b.label)).map(e=>`<tr>
    <td>${entLink(e.key)}</td><td class="mut">${esc(e.kind)}</td>
    <td>${e.upstream.map(entLink).join(", ")||'<span class="mut">— root —</span>'}</td>
    <td>${e.downstream.map(entLink).join(", ")||'<span class="mut">— terminal —</span>'}</td></tr>`).join("")}
  </tbody></table></div></details>`;
}
function linExplore(q){
  q = q.trim().toLowerCase();
  const host = document.getElementById("lin-result");
  if(q.length<2){ host.innerHTML = '<span class="mut">Pick an entity to see everything upstream and downstream, transitively.</span>'; return; }
  const hits = DATA.entities.filter(e =>
    e.label.toLowerCase().includes(q) ||
    e.aliases.some(a=>a.toLowerCase().includes(q)) ||
    Object.values(e.endpoint).some(v=>v&&String(v).toLowerCase().includes(q))
  ).slice(0,8);
  if(!hits.length){ host.innerHTML = `<span class="mut">No entity matches "${esc(q)}".</span>`; return; }
  host.innerHTML = hits.map(e=>`
    <div style="border-top:1px solid var(--line2);padding:.55rem 0">
      <b>${entLink(e.key)}</b> <span class="badge b-other">${esc(e.kind)}</span> ${e.dynamic?'<span class="badge b-warn">dynamic</span>':""}
      <div class="mut" style="margin:.25rem 0">Depends on: ${e.upstream.map(entLink).join(", ")||"— nothing in this factory (root) —"}</div>
      <div class="mut">Feeds: ${e.downstream.map(entLink).join(", ")||"— nothing in this factory (terminal) —"}</div>
      <div class="mut" style="margin-top:.25rem">Touched by: ${e.referencedBy.slice(0,5).map(esc).join("; ")}${e.referencedBy.length>5?" …":""}</div>
    </div>`).join("");
}

/* ============================================================ pipelines */
function actRow(a){
  const flags = [];
  if(a.dynamic) flags.push('<span class="badge b-warn">dynamic</span>');
  if(a.opaque)  flags.push('<span class="badge b-info">opaque</span>');
  if(a.inactive) flags.push('<span class="badge b-bad">inactive</span>');
  const cond = a.dependsOn.filter(d=>d.on&&d.on!=="Succeeded");
  if(cond.length) flags.push(`<span class="badge b-warn">after ${esc(cond.map(d=>`${d.activity}[${d.on}]`).join(", "))}</span>`);
  if(a.step===0) flags.push('<span class="badge b-bad">cycle</span>');
  const inv = a.invokesPipeline ? ` → ${pipeLink(a.invokesPipeline)}`
            : a.invokesDataflow ? ` → ${dfLink(a.invokesDataflow)}` : "";
  return `<details class="act">
    <summary><span class="step">${a.step===0?"↺":a.step}</span>${esc(a.activity)} ${catBadge(a.category)} <span class="mut" style="font-weight:400">${esc(a.type)}</span>${inv} ${flags.join(" ")}</summary>
    <div class="body">
      ${a.description?`<p class="mut">${esc(a.description)}</p>`:""}
      <div class="kv">
        <div class="k">Reads</div><div>${entPills(a.reads,"b-src")}</div>
        <div class="k">Writes</div><div>${entPills(a.writes,"b-snk")}</div>
        ${a.detail?`<div class="k">Detail</div><div class="mut">${esc(a.detail)}</div>`:""}
        ${a.dependsOn.length?`<div class="k">Depends on</div><div class="mut">${a.dependsOn.map(d=>`${esc(d.activity)}${d.on&&d.on!=="Succeeded"?` <span class="badge b-warn">${esc(d.on)}</span>`:""}`).join(", ")}</div>`:""}
        ${a.parallelWith.length?`<div class="k">Parallel with</div><div class="mut">${a.parallelWith.map(esc).join(", ")}</div>`:""}
        <div class="k">Policy</div><div class="mut">${a.retry?`retry ${a.retry}`:'<span style="color:var(--warn)">no retry</span>'}${a.timeout?` · timeout ${esc(a.timeout)}`:""}</div>
      </div>
      ${a.query?`<div class="k mut" style="font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;margin-top:.4rem">Query / script</div><pre class="code">${esc(a.query)}</pre>`:""}
    </div>
  </details>`;
}
function rPipelines(){
  const cards = DATA.pipelines.map(p=>{
    const scopes = {};
    for(const a of p.activities) (scopes[a.scope] = scopes[a.scope] || []).push(a);
    const scopeHtml = Object.entries(scopes).map(([scope, acts])=>`
      ${scope==="(root)"?"":`<div class="scopehdr">inside ${esc(scope)}</div>`}
      ${acts.slice().sort((x,y)=>(x.step===0?99:x.step)-(y.step===0?99:y.step)||x.activity.localeCompare(y.activity)).map(actRow).join("")}`).join("");
    const badges = [
      p.entryPoint?'<span class="badge b-orchestration">entry point</span>':"",
      p.effectiveIncomplete.length?`<span class="badge b-bad" title="Not supplied, so what they read and write is unknown: ${esc(p.effectiveIncomplete.join(", "))}">rollup incomplete</span>`:"",
      p.opaqueCount?`<span class="badge b-info">${p.opaqueCount} opaque</span>`:"",
      p.dynamicCount?`<span class="badge b-warn">${p.dynamicCount} dynamic</span>`:"",
    ].filter(Boolean).join(" ");
    const cats = Object.entries(p.categories).map(([c,n])=>`${n} ${c}`).join(", ");
    return `<details id="pl-${slug(p.name)}">
      <summary>${esc(p.name)} ${badges}
        <span class="mut" style="font-weight:400;margin-left:auto">${esc(p.roleLine)} · ${p.activityCount} activities</span></summary>
      <div class="body">
        ${p.description?`<p class="mut" style="margin:.5rem 0">${esc(p.description)}</p>`:""}
        <div class="act kv" style="border:0;margin:.5rem 0">
          ${p.folder?`<div class="k">Folder</div><div class="mut">${esc(p.folder)}</div>`:""}
          <div class="k">Started by</div><div class="mut">${[...p.triggers.map(t=>TRIDX[t]?go("trg", t, esc(t)):esc(t)), ...p.invokedBy.map(esc)].join(", ")||"nothing in this factory (may be invoked externally)"}</div>
          ${p.invokes.length?`<div class="k">Invokes</div><div>${p.invokes.map(pipeLink).join(", ")}</div>`:""}
          ${p.dataflows.length?`<div class="k">Data flows</div><div>${p.dataflows.map(dfLink).join(", ")}</div>`:""}
          ${Object.keys(p.parameters).length?`<div class="k">Parameters</div><div class="mut">${Object.entries(p.parameters).map(([k,v])=>`<span class="ref">${esc(k)}: ${esc(v)}</span>`).join(" ")}</div>`:""}
          ${Object.keys(p.variables).length?`<div class="k">Variables</div><div class="mut">${Object.entries(p.variables).map(([k,v])=>`<span class="ref">${esc(k)}: ${esc(v)}</span>`).join(" ")}</div>`:""}
          <div class="k">Activity mix</div><div class="mut">${esc(cats)}</div>
          <div class="k">Reads (effective)</div><div>${entPills(p.effectiveReads,"b-src")}${p.effectiveIncomplete.length?` <span class="mut">— incomplete: ${p.effectiveIncomplete.map(esc).join(", ")} not supplied, so their reads and writes are unknown</span>`:""}</div>
          <div class="k">Writes (effective)</div><div>${entPills(p.effectiveWrites,"b-snk")}${p.effectiveIncomplete.length?` <span class="mut">— incomplete</span>`:""}</div>
        </div>
        <h3>Activity flow <span class="mut" style="font-weight:400">(step number = execution order; equal steps can run in parallel)</span></h3>
        ${scopeHtml}
      </div>
    </details>`;
  }).join("");
  return `<h1>Pipelines</h1>
  <p class="sub">Effective reads/writes include everything a pipeline transitively invokes (child pipelines, data flows) — the high-level answer to "what does this pipeline do overall". Expand for the activity flow; expand an activity for full detail.</p>
  <input class="search" placeholder="Search pipelines…" oninput="fCards(this.value,'pl-list')">
  <div id="pl-list">${cards}</div>`;
}
function fCards(q, listId){
  q=q.toLowerCase();
  document.querySelectorAll(`#${listId} > details`).forEach(d=>{
    d.style.display = d.querySelector("summary").textContent.toLowerCase().includes(q)?"":"none";
  });
}

/* ============================================================ data flows */
function rDataflows(){
  const cards = DATA.dataflows.map(df=>`
    <details id="df-${slug(df.name)}">
      <summary>${esc(df.name)} ${df.deadEnds.length?`<span class="badge b-warn">${df.deadEnds.length} dead end(s)</span>`:""}

      <div class="body">
        ${df.description?`<p class="mut" style="margin:.5rem 0">${esc(df.description)}</p>`:""}

        <div class="grid" style="grid-template-columns:1fr 1fr;margin:.6rem 0">
          <div class="card" style="margin:0"><div class="eyebrow" style="color:var(--src)">Sources</div>

          <div class="card" style="margin:0"><div class="eyebrow" style="color:var(--snk)">Sinks</div>
            ${df.sinks.map(s=>`<div style="margin-top:.3rem"><span class="ref">${esc(s.stream)}</span> → ${s.dataset?dsLink(s.dataset):esc(s.label)}</div>`).join("")||'<span class="mut">—</span>'}</div>
        </div>
        <h3>Transformation chain <span class="mut" style="font-weight:400">(execution order)</span></h3>
        <table class="t"><thead><tr><th>#</th><th>Step</th><th>Op</th><th>Inputs</th><th>Output streams</th><th>Config</th></tr></thead><tbody>
        ${df.steps.slice().sort((a,b)=>(a.execOrder||1e6)-(b.execOrder||1e6)).map(s=>`<tr>
          <td class="mut">${s.execOrder||"?"}</td>
          <td>${esc(s.name)} ${s.deadEnd?'<span class="badge b-warn">dead end</span>':""}</td>
          <td>${catBadge(s.op==="source"?"read":s.op==="sink"?"movement":"transform")} <span class="mut">${esc(s.op)}</span></td>
          <td class="mut">${s.inputs.map(esc).join("; ")||"—"}</td>
          <td class="mut">${s.outputStreams.map(esc).join("; ")||"—"}</td>
          <td class="mut" style="max-width:340px">${esc(s.config)}</td></tr>`).join("")}
        </tbody></table>
        ${df.sinkTraces.length?`<h3>Sink traces — each sink back to its sources</h3>
        ${df.sinkTraces.map(t=>`<div class="mut" style="margin:.25rem 0"><span class="ref">${esc(t.sink)}</span> ← sources: <b>${t.sources.map(esc).join(", ")||"?"}</b> — path: ${t.chain.map(esc).join(" → ")}</div>`).join("")}`:""}
      </div>
    </details>`).join("");
  return `<h1>Mapping data flows</h1>
  <p class="sub">Each flow's transformation chain parsed from its script, in execution order, with every sink traced back to the sources that feed it. Dead ends are transformations whose output nothing consumes — dead logic, or a connection never made.</p>
  <input class="search" placeholder="Search data flows…" oninput="fCards(this.value,'df-list')">
  <div id="df-list">${cards}</div>`;
}

/* ============================================================ datasets */
function rDatasets(){
  const rows = DATA.datasets.map(d=>{

      <td><span class="ref">${esc(target)}</span></td>
      <td class="mut">${d.referencedBy.slice(0,3).map(esc).join("<br>")}${d.referencedBy.length>3?`<br>+${d.referencedBy.length-3} more`:""}${d.referencedBy.length?"":'<span class="mut">not referenced by any supplied pipeline or data flow</span>'}</td></tr>`;

function fRows(q){

        <div class="k">Type</div><div class="mut">${esc(ls.type)}</div>

function rTriggers(){
  const rows = DATA.triggers.map(t=>`<tr id="trg-${slug(t.name)}">

/* ============================================================ warnings */
let wFilter = "all";
function rWarnings(){
  const ws = DATA.warnings;
  if(!ws.length) return `<h1>Warnings</h1><div class="empty"><b>Nothing flagged.</b><br>The static analysis found no unresolved references, dead resources, dynamic targets, opaque hops, or hygiene issues.</div>`;
  const cats = [...new Set(ws.map(w=>w.category))].sort();
  const shown = ws.filter(w=>wFilter==="all"||w.category===wFilter);
  return `<h1>Warnings — read before changing anything</h1>
  <p class="sub">Everything the static analysis flagged: where lineage goes dark, what looks dead, what is fragile, and where this document's own picture is incomplete.</p>
  <div class="filter-row">
    <button class="chip ${wFilter==="all"?"on":""}" data-go="wfilter" data-arg="all">all (${ws.length})</button>
    ${cats.map(c=>`<button class="chip ${wFilter===c?"on":""}" data-go="wfilter" data-arg="${esc(c)}">${esc(c)} (${ws.filter(w=>w.category===c).length})</button>`).join("")}
  </div>
  ${shown.some(w=>w.severity!=="info")?"":`<div class="card"><b>No warnings.</b> <span class="mut">Only notes below: limits of what static analysis can see.</span></div>`}
  ${wTable(shown.filter(w=>w.severity!=="info"))}
  ${(()=>{ const infos = shown.filter(w=>w.severity==="info");
    if(!infos.length) return "";
    const groups = {}; infos.forEach(w=>(groups[w.category]=groups[w.category]||[]).push(w));
    return `<h2>Notes <span class="mut" style="font-weight:400">(${infos.length}) — how far static analysis can see</span></h2>`
      + Object.entries(groups).sort().map(([c,g])=>`<details id="wn-${slug(c)}"${wFilter===c?" open":""}><summary>${esc(c)} <span class="badge b-info">${g.length}</span></summary><div class="body table-wrap">${wTable(g,false)}</div></details>`).join("");
  })()}`;
}
function wTable(ws, sev=true){
  if(!ws.length) return "";
  return `<div class="table-wrap"><table class="t"><thead><tr>${sev?"<th>Severity</th><th>Category</th>":""}<th>Detail</th></tr></thead><tbody>
  ${ws.map(w=>`<tr>${sev?`<td><span class="badge ${w.severity==="warning"?"b-warn":"b-info"}">${esc(w.severity)}</span></td><td class="mut">${esc(w.category)}</td>`:""}<td>${esc(w.message)}</td></tr>`).join("")}
  </tbody></table></div>`;
}

/* ============================================================ shared: csv */
function csvCell(v){ v = v==null ? "" : String(v); return /[",\n\r]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; }
function toCsv(cols, rows){ return [cols.map(c=>csvCell(c[0])).join(","), ...rows.map(r=>cols.map(c=>csvCell(c[1](r))).join(","))].join("\r\n"); }
const CSV = {
  objects: () => toCsv([["key",e=>e.key],["kind",e=>e.kind],["name",e=>e.label],["system",e=>e.endpoint.system],
    ["server",e=>e.endpoint.server||e.endpoint.url],["database",e=>e.endpoint.database],["container",e=>e.endpoint.container],
    ["schema",e=>e.endpoint.schema],["object",e=>e.endpoint.object],["path",e=>e.endpoint.path],["dynamic",e=>e.dynamic],
    ["datasets",e=>e.aliases.join("; ")],["linked services",e=>(e.linkedServices||[]).join("; ")],
    ["pipelines",e=>(e.pipelines||[]).join("; ")],["triggers",e=>(e.triggers||[]).join("; ")]], DATA.entities),
  usage: () => toCsv([["object key",r=>r.key],["object",r=>r.label],["operation",r=>r.u.operation],["pipeline",r=>r.u.pipeline],
    ["activity",r=>r.u.activity],["activity type",r=>r.u.type],["dynamic",r=>r.u.dynamic],["opaque",r=>r.u.opaque]],
    DATA.entities.flatMap(e=>(e.usage||[]).map(u=>({key:e.key,label:e.label,u})))),
  edges: () => toCsv([["sources",e=>e.sources.map(entLabel).join("; ")],["sinks",e=>e.sinks.map(entLabel).join("; ")],
    ["mechanism",e=>e.mechanism],["pipeline",e=>e.pipeline],["activity",e=>e.activity],["dynamic",e=>e.dynamic],
    ["opaque",e=>e.opaque],["detail",e=>e.detail]], DATA.lineageEdges),
  issues: () => toCsv([["priority",i=>i.priority],["category",i=>i.category],["resource",i=>i.resource],
    ["finding",i=>i.message],["why it matters",i=>i.why],["next action",i=>i.action]], DATA.issues||[]),
};
function downloadCsv(name){
  const blob = new Blob(["\ufeff"+CSV[name]()], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `${(DATA.title||"factory").replace(/[^\w.-]+/g,"_")}-${name}.csv`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
const csvBtn = (name, label) => `<button class="chip" data-go="csv" data-arg="${name}">Download ${label} (CSV)</button>`;

/* ============================================================ data & sources: objects */
let SEL_OBJ = null, OBJ_KIND = "physical";
const PHYSICAL = new Set(["table","file_path","inline_dataset","dataset"]);
const KIND_LABEL = {table:"Table", file_path:"File / folder", inline_dataset:"Inline source", dataset:"Unresolved dataset",
  stored_procedure:"Procedure", notebook:"Notebook", code_artifact:"Code", endpoint:"Endpoint", linked_service:"Connection"};
const opBadge = op => `<span class="badge ${({read:"b-src",write:"b-snk",delete:"b-bad",execute:"b-transform",call:"b-external"})[op]||"b-other"}">${esc(op)}</span>`;
function objMatches(e){
  if(OBJ_KIND==="physical") return PHYSICAL.has(e.kind);
  if(OBJ_KIND==="code") return ["stored_procedure","notebook","code_artifact","endpoint"].includes(e.kind);
  if(OBJ_KIND==="connections") return e.kind==="linked_service";
  return true;
}
function rObjects(){
  const shown = DATA.entities.filter(objMatches)
    .sort((a,b)=>(PHYSICAL.has(b.kind)-PHYSICAL.has(a.kind)) || a.label.localeCompare(b.label));
  const kinds = [["physical","Tables and files"],["code","Procedures, notebooks, endpoints"],["connections","Connections"],["all","Everything"]];
  const rows = shown.map(e=>{
    const ops = new Set((e.usage||[]).map(u=>u.operation));
    return `<tr id="obj-${slug(e.key)}" class="${e.key===SEL_OBJ?"sel":""}">
      <td>${go("obj", e.key, esc(e.label))}${e.dynamic?' <span class="badge b-warn">dynamic</span>':""}</td>
      <td class="mut">${esc(entWhere(e)||"—")}</td>
      <td class="mut">${esc(KIND_LABEL[e.kind]||e.kind)}</td>
      <td>${[...ops].sort().map(opBadge).join(" ")||'<span class="mut">—</span>'}</td>
      <td class="mut">${(e.pipelines||[]).length}</td></tr>`;}).join("");
  return `<h1>Objects: what this factory reads and writes</h1>
  <p class="sub">Physical tables, files and folders first, each identified by where it lives (server or storage account, database or container, name). Select one to see every pipeline and activity that reads, writes, deletes or runs it, and what starts them.</p>
  <div class="filter-row">${kinds.map(([k,l])=>`<button class="chip ${OBJ_KIND===k?"on":""}" data-go="objkind" data-arg="${k}">${l}</button>`).join("")}
    <span style="flex:1"></span>${csvBtn("objects","objects")} ${csvBtn("usage","usage")}</div>
  <input class="search" placeholder="Filter by name, server, database, pipeline…" oninput="fObjects(this.value)" aria-label="Filter objects">
  <div class="split">
    <div class="table-wrap"><table class="t" id="obj-table"><thead><tr><th>Object</th><th>Where</th><th>Kind</th><th>Operations</th><th>Pipelines</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="5" class="mut">Nothing of this kind in the input.</td></tr>'}</tbody></table></div>
    <aside class="panel" id="obj-panel" aria-live="polite">${objectPanel()}</aside>
  </div>`;
}
function fObjects(q){
  q = q.toLowerCase();
  document.querySelectorAll("#obj-table tbody tr").forEach(tr=>{
    const e = EIDX[[...EIDX_KEYS].find(k=>"obj-"+slug(k)===tr.id)];
    const hay = e ? [e.label, entWhere(e), ...(e.pipelines||[]), ...e.aliases].join(" ").toLowerCase() : tr.textContent.toLowerCase();
    tr.style.display = hay.includes(q) ? "" : "none";
  });
}
const EIDX_KEYS = new Set(Object.keys(EIDX));
function renderObjectPanel(){
  const p = document.getElementById("obj-panel");
  if(!p){ switchTab("objects"); return; }
  p.innerHTML = objectPanel();
  document.querySelectorAll("#obj-table tbody tr").forEach(tr=>tr.classList.toggle("sel", tr.id==="obj-"+slug(SEL_OBJ)));
  p.focus && p.scrollTo(0,0);
}
function objectPanel(){
  const e = EIDX[SEL_OBJ];
  if(!e) return `<div class="mut">Select an object to see its detail.</div>`;
  const ep = e.endpoint;
  const where = [["System",ep.system],["Server / account",ep.server||ep.url],["Database",ep.database],["Container",ep.container],
    ["Schema",ep.schema],["Object",ep.object],["Path",ep.path]].filter(([,v])=>v);
  const dsSources = e.aliases.filter(a=>DSIDX[a]).map(a=>`${dsLink(a)}${DSIDX[a].source?` <span class="mut">${esc(DSIDX[a].source)}</span>`:""}`);
  const usage = (e.usage||[]).map(u=>`<tr><td>${opBadge(u.operation)}</td><td>${u.pipeline?pipeLink(u.pipeline):(u.dataflow?dfLink(u.dataflow):"—")}<div class="mut">${esc(u.activity||"")}${u.type?` · ${esc(u.type)}`:""}</div></td>
    <td>${u.dynamic?'<span class="badge b-warn">dynamic</span>':""}${u.opaque?'<span class="badge b-info">opaque</span>':""}</td></tr>`).join("");
  return `<div class="eyebrow">${esc(KIND_LABEL[e.kind]||e.kind)}</div>
  <h2 style="margin-top:.2rem">${esc(e.label)}</h2>
  ${e.dynamic?`<p><span class="badge b-warn">dynamic</span> <span class="mut">Resolved at runtime; this is what can be known before the run.</span></p>`:""}
  ${where.length?`<div class="kvl">${where.map(([k,v])=>`<div class="k">${k}</div><div>${esc(v)}</div>`).join("")}</div>`:`<p class="mut">Location not stated in the definitions.</p>`}
  <h3>Used by</h3>
  ${usage?`<table class="t"><tbody>${usage}</tbody></table>`:`<p class="mut">No activity in this input uses it.</p>`}
  <h3>Started by</h3><p>${(e.triggers||[]).map(t=>TRIDX[t]?go("trg",t,esc(t)):esc(t)).join(", ")||'<span class="mut">No trigger in this input starts the pipelines that use it.</span>'}</p>
  ${(e.linkedServices||[]).length?`<h3>Connection</h3><p>${e.linkedServices.map(lsLink).join(", ")}</p>`:""}
  ${dsSources.length?`<h3>Defined by</h3><p>${dsSources.join("<br>")}</p>`:""}
  <h3>Depends on</h3><p>${e.upstream.map(entLink).join(", ")||'<span class="mut">Nothing in this factory (an external input).</span>'}</p>
  <h3>Feeds</h3><p>${e.downstream.map(entLink).join(", ")||'<span class="mut">Nothing in this factory (a final output).</span>'}</p>
  <p style="margin-top:1rem"><button class="chip on" data-go="impact" data-arg="${esc(e.key)}">Show impact of a change</button></p>`;
}

/* ============================================================ impact */
let IMPACT = null;
/* Walk movement edges from a set of objects. An edge that is dynamic or
   opaque makes everything reached through it "possible" rather than confirmed. */
function walk(startKeys, forward){
  const state = new Map();   // key -> "confirmed" | "possible"
  const queue = startKeys.map(k=>[k,"confirmed"]);
  const pipes = new Map();
  const better = (a,b)=> a==="confirmed"||b==="confirmed" ? "confirmed" : "possible";
  while(queue.length){
    const [k, how] = queue.shift();
    for(const e of DATA.lineageEdges){
      const from = forward ? e.sources : e.sinks, to = forward ? e.sinks : e.sources;
      if(!from.includes(k)) continue;
      const h = (how==="possible"||e.dynamic||e.opaque) ? "possible" : "confirmed";
      if(e.pipeline && PIDX[e.pipeline]) pipes.set(e.pipeline, pipes.has(e.pipeline)?better(pipes.get(e.pipeline),h):h);
      for(const t of to){
        if(t===k || startKeys.includes(t)) continue;
        const prev = state.get(t);
        const next = prev ? better(prev,h) : h;
        if(prev!==next){ state.set(t,next); queue.push([t,next]); }
      }
    }
  }
  return {objects: state, pipelines: pipes};
}
function impactOf(sel){
  let start = [], label = "", kind = "object";
  if(sel && sel.startsWith("pipeline:")){
    const p = PIDX[sel.slice(9)]; if(!p) return null;
    start = p.effectiveWrites; label = p.name; kind = "pipeline";
  } else if(EIDX[sel]){ start = [sel]; label = EIDX[sel].label; }
  else return null;
  const down = walk(start, true), up = walk(start, false);
  // Pipelines that read anything affected are affected too (the object changes under them).
  const affected = new Map(down.pipelines);
  const reached = new Map([...start.map(k=>[k,"confirmed"]), ...down.objects]);
  for(const [k,how] of reached){
    for(const u of (EIDX[k]?.usage||[])){
      if(!u.pipeline || (kind==="pipeline" && u.pipeline===label)) continue;
      const h = (how==="possible"||u.dynamic||u.opaque) ? "possible" : "confirmed";
      affected.set(u.pipeline, affected.get(u.pipeline)==="confirmed" ? "confirmed" : h);
    }
  }
  if(kind==="pipeline") affected.delete(label);
  const triggers = new Map();
  for(const [pl,how] of affected){
    const p = PIDX[pl]; if(!p) continue;
    for(const t of p.startedBy||[]) triggers.set(t, triggers.get(t)==="confirmed" ? "confirmed" : how);
    for(const o of p.orchestratedBy||[]) if(!affected.has(o)) affected.set(o, how);
  }
  return {label, kind, start, down: down.objects, up: up.objects, affected, triggers};
}
const howBadge = h => h==="confirmed" ? '<span class="badge b-ok">confirmed</span>' : '<span class="badge b-warn">possible</span>';
function rImpact(){
  const options = [
    ...DATA.entities.filter(e=>PHYSICAL.has(e.kind)||e.kind==="stored_procedure").sort((a,b)=>a.label.localeCompare(b.label))
      .map(e=>[e.key, `${e.label}${entWhere(e)?"  ·  "+entWhere(e):""}`]),
    ...DATA.pipelines.map(p=>["pipeline:"+p.name, "Pipeline: "+p.name])];
  if(!IMPACT && options.length) IMPACT = options[0][0];
  const r = impactOf(IMPACT);
  const list = (m, fn) => m.size ? `<ul class="plain">${[...m].sort((a,b)=>(a[1]>b[1])-(a[1]<b[1])).map(([k,h])=>`<li>${howBadge(h)} ${fn(k)}</li>`).join("")}</ul>` : '<p class="mut">None in this input.</p>';
  const opaqueHere = r ? [...r.affected.keys()].filter(pl=>PIDX[pl] && (PIDX[pl].opaqueCount||0)>0) : [];
  return `<h1>Impact: what changes if this changes</h1>
  <p class="sub">Choose a table, file or pipeline. <b>Confirmed</b> means a static data movement in the definitions leads there. <b>Possible</b> means the path passes through a runtime-resolved target or code ADF cannot see (notebook, procedure, web call), so it may or may not be affected. Nothing outside the supplied input is shown.</p>
  <label class="field"><span>Object or pipeline</span>
  <select id="impact-sel" onchange="IMPACT=this.value;switchTab('impact')">${options.map(([k,l])=>`<option value="${esc(k)}"${k===IMPACT?" selected":""}>${esc(l)}</option>`).join("")}</select></label>
  ${!r?'<div class="empty">Nothing to show.</div>':`
  <div class="impact-grid">
    <div class="card"><div class="eyebrow">Depends on (upstream)</div>${list(r.up, entLink)}</div>
    <div class="card focus"><div class="eyebrow">${r.kind==="pipeline"?"Pipeline":"Selected object"}</div><h2 style="margin:.2rem 0">${esc(r.label)}</h2>
      ${r.kind==="pipeline"?`<p class="mut">Starts from what it writes: ${r.start.map(entLink).join(", ")||"nothing"}</p>`:
        `<p>${go("obj", IMPACT, "Open object detail")}</p>`}</div>
    <div class="card"><div class="eyebrow">Feeds (downstream)</div>${list(r.down, entLink)}</div>
  </div>
  <div class="impact-grid two">
    <div class="card"><div class="eyebrow">Affected pipelines</div>${list(r.affected, pipeLink)}</div>
    <div class="card"><div class="eyebrow">Triggers that start them</div>${list(r.triggers, t=>TRIDX[t]?go("trg",t,esc(t)):esc(t))}</div>
  </div>
  ${opaqueHere.length?`<div class="card note"><b>Look inside the code too.</b> ${opaqueHere.map(pipeLink).join(", ")} ${opaqueHere.length>1?"run":"runs"} notebooks, procedures or external calls whose own reads and writes are not visible here.</div>`:""}`}`;
}

/* ============================================================ review issues */
let ISSUE_FILTER = "all";
const PRIO = {high:"b-bad", medium:"b-warn", low:"b-info"};
function resourceLink(name){
  if(!name) return "";
  if(name.includes("::")){ const [pl, act] = name.split("::"); return `${pipeLink(pl)} <span class="mut">:: ${esc(act)}</span>`; }
  if(PIDX[name]) return pipeLink(name);
  if(DSIDX[name]) return dsLink(name);
  if(LSIDX[name]) return lsLink(name);
  if(DFIDX[name]) return dfLink(name);
  if(TRIDX[name]) return go("trg", name, esc(name));
  const e = DATA.entities.find(x=>x.label===name); if(e) return entLink(e.key);
  return `<span class="ref">${esc(name)}</span>`;
}
function rIssues(){
  const all = DATA.issues||[];
  const shown = all.filter(i=>ISSUE_FILTER==="all"||i.priority===ISSUE_FILTER);
  const counts = p => all.filter(i=>i.priority===p).length;
  return `<h1>Review issues: what to investigate first</h1>
  <p class="sub">Findings ranked by how much they affect trust in the factory or this document, each with why it matters and a next step. Limits of static analysis (runtime targets, opaque code, retries) are under <b>All findings and notes</b>.</p>
  <div class="filter-row">${["all","high","medium","low"].map(p=>`<button class="chip ${ISSUE_FILTER===p?"on":""}" data-go="issuefilter" data-arg="${p}">${p} (${p==="all"?all.length:counts(p)})</button>`).join("")}
    <span style="flex:1"></span>${csvBtn("issues","issues")}</div>
  ${missing.length?`<div class="card note"><b>${missing.length} referenced object(s) were not supplied.</b> Export them to complete this document: ${missing.slice(0,6).map(r=>`<span class="ref">${esc(r.kind)} ${esc(r.name)}</span>`).join(" ")}${missing.length>6?" …":""}</div>`:""}
  ${shown.length?shown.map(i=>`<div class="card issue">
    <div class="issue-head"><span class="badge ${PRIO[i.priority]}">${esc(i.priority)}</span> <b>${esc(i.category)}</b> ${i.resource?"· "+resourceLink(i.resource):""}</div>
    <p style="margin:.35rem 0">${esc(i.message)}</p>
    ${i.why?`<p class="mut"><b>Why it matters:</b> ${esc(i.why)}</p>`:""}
    <p class="mut"><b>Next step:</b> ${esc(i.action)}</p></div>`).join("")
    :`<div class="empty"><b>Nothing to review at this priority.</b></div>`}`;
}

/* ============================================================ factory details */
const DETAIL_FIELDS = {environment:"Environment (e.g. Production)", owner:"Owner or team",
  factory:"Factory resource (subscription / resource group / name)",
  sourceLocation:"Source location (Git repository and branch, or export path)",
  runbook:"Runbook or support page", folder:"Home page group (e.g. Finance / Daily)", notes:"Notes"};
const SECRETISH = /(password|pwd|secret|accountkey|sharedaccess|token|apikey)\s*=|[?&](sig|token|code|key|apikey)=|bearer\s+\S{8,}|:\/\/[^\/\s@]+@/i;
function readDetails(){ try{ return JSON.parse(document.getElementById("adf-documentation-details")?.textContent||"{}")||{}; }catch(e){ return {}; } }
let DETAILS = Object.assign(Object.fromEntries(Object.keys(DETAIL_FIELDS).map(k=>[k,""])), readDetails());
let SAVED_DETAILS = JSON.stringify(DETAILS);
function captureDetails(){
  for(const k of Object.keys(DETAIL_FIELDS)){ const el = document.getElementById("det-"+k); if(el) DETAILS[k] = el.value; }
  const bad = Object.entries(DETAILS).filter(([,v])=>SECRETISH.test(v)).map(([k])=>DETAIL_FIELDS[k]);
  const n = Object.keys(DETAIL_FIELDS).filter(k=>DETAILS[k]!==JSON.parse(SAVED_DETAILS)[k]).length;
  const bar = document.getElementById("det-savebar"), st = document.getElementById("det-status"), btn = document.getElementById("det-save");
  if(!bar) return;
  bar.classList.toggle("dirty", n>0);
  btn.disabled = bad.length>0;
  st.textContent = bad.length ? `Remove what looks like a secret from: ${bad.join(", ")}. Record where the secret lives instead.`
    : n ? `${n} unsaved ${n===1?"change":"changes"}. Download the updated HTML and replace the original file to keep them.`
        : "No unsaved changes. Details are kept when this document is regenerated over the same file.";
}
function saveDetailsHtml(){
  captureDetails();
  if(document.getElementById("det-save").disabled) return;
  const clone = document.documentElement.cloneNode(true);
  clone.querySelector("#adf-documentation-details").textContent =
    JSON.stringify(DETAILS).replace(/</g,"\\u003c").replace(/>/g,"\\u003e").replace(/&/g,"\\u0026");
  clone.querySelector("#main").innerHTML = ""; clone.querySelector("#nav").innerHTML = "";
  const blob = new Blob(["<!DOCTYPE html>\n"+clone.outerHTML], {type:"text/html;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = DATA.documentationFilename || "factory.html"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  SAVED_DETAILS = JSON.stringify(DETAILS); captureDetails();
  document.getElementById("det-status").textContent = "Downloaded. Replace the original HTML with the downloaded file to keep these details.";
}
function rDetails(){
  const c = DATA.coverage||{};
  const field = k => k==="notes"
    ? `<label class="field wide"><span>${esc(DETAIL_FIELDS[k])}</span><textarea id="det-${k}" rows="4" oninput="captureDetails()">${esc(DETAILS[k])}</textarea></label>`
    : `<label class="field"><span>${esc(DETAIL_FIELDS[k])}</span><input id="det-${k}" value="${esc(DETAILS[k])}" oninput="captureDetails()"></label>`;
  return `<h1>Factory details</h1>
  <p class="sub">Who owns this factory, where its source lives and how to support it. These details are kept in this file, survive regeneration over the same file, and are shown on the documentation home. Record references only: never passwords, keys or tokens.</p>
  <div class="card details-grid">${Object.keys(DETAIL_FIELDS).map(field).join("")}</div>
  <div id="det-savebar" class="savebar"><p id="det-status" role="status"></p><button class="primary-btn" id="det-save" onclick="saveDetailsHtml()">Download updated HTML</button></div>
  <h2>How this document was generated</h2>
  <div class="card kvl">
    <div class="k">Generated</div><div>${esc(DATA.generated)} by ${esc(DATA.generator)} (payload version ${esc(DATA.schemaVersion)})</div>
    <div class="k">Input</div><div>${esc((c.inputFormats||[]).join(", ")||"unknown")} · ${esc(c.jsonFiles)} JSON file(s)${c.skippedFiles?` · ${esc(c.skippedFiles)} unreadable`:""}</div>
    <div class="k">Mode</div><div>${esc(MODE)}</div>
    <div class="k">Secrets withheld</div><div>${esc(DATA.redactions||0)}</div>
    <div class="k">Run history</div><div class="mut">Not available: this document is generated from definitions, not from runs.</div>
  </div>
  <h2>Where each definition came from</h2>
  <div class="table-wrap"><table class="t"><thead><tr><th>Kind</th><th>Name</th><th>Source file</th></tr></thead><tbody>
  ${[["pipeline",DATA.pipelines,pipeLink],["data flow",DATA.dataflows,dfLink],["dataset",DATA.datasets,dsLink],["linked service",DATA.linkedServices,lsLink],["trigger",DATA.triggers,n=>go("trg",n,esc(n))]]
    .flatMap(([k,list,link])=>list.map(x=>`<tr><td class="mut">${k}</td><td>${link(x.name)}</td><td class="mut">${esc(x.source||"—")}</td></tr>`)).join("")}
  </tbody></table></div>`;
}

/* ============================================================ boot */
const RENDER = {overview:rOverview, orchestration:rOrchestration, lineage:rLineage,
  pipelines:rPipelines, dataflows:rDataflows, datasets:rDatasets, linked:rLinked,
  triggers:rTriggers, warnings:rWarnings, objects:rObjects, impact:rImpact,
  issues:rIssues, details:rDetails};
buildNav();
switchTab("overview");
const _render = RENDER.details;
RENDER.details = () => { const h = _render(); requestAnimationFrame(captureDetails); return h; };
</script>
